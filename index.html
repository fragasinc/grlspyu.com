["CONFISSÃO ANÔNIMA|ANONYMOUS CONFESSION|CONFESIÓN ANÓNIMA|ANONYMES GESTÄNDNIS","Uma declaração e zero pistas|One confession and zero clues|Una declaración y cero pistas|Ein Geständnis, null Hinweise","💌","Um cartaz GIGANTE apareceu na padaria do bairro: “Eu gosto de você há mais tempo do que imagina”. O padeiro garante que o recado estava escrito em glacê, em cima de um bolo de três andares.\nO Caio, aquele cabeça-oca, é o principal suspeito, mas ninguém acredita que ele teria coragem. Outros apostam na Jade, a boca grande de sempre.|A GIANT banner appeared at the neighborhood bakery: “I've liked you for longer than you think.” The baker swears the message was written in icing on a three-tier cake.\nCaio, that airhead, is the main suspect, but nobody believes he'd have the guts. Others bet on Jade, the usual loudmouth.|Apareció un cartel GIGANTE en la panadería del barrio: «Me gustas desde hace más tiempo del que imaginas». El panadero jura que el mensaje estaba escrito con glaseado sobre un pastel de tres pisos.\nCaio, ese cabeza hueca, es el principal sospechoso, pero nadie cree que tenga agallas. Otros apuestan por Jade, la bocona de siempre.|In der Bäckerei des Viertels tauchte ein RIESIGES Plakat auf: „Ich mag dich schon länger, als du denkst.“ Der Bäcker schwört, die Botschaft sei mit Zuckerguss auf eine dreistöckige Torte geschrieben gewesen.\nCaio, dieser Hohlkopf, ist der Hauptverdächtige, aber niemand glaubt, dass er den Mut hätte. Andere tippen auf Jade, das übliche Großmaul."],

["FLAGRA SUSPEITO|SUSPICIOUS SIGHTING|AVISTAMIENTO SOSPECHOSO|VERDÄCHTIGE BEOBACHTUNG","O encontro que terminou cedo demais|The meeting that ended too soon|El encuentro que terminó demasiado pronto|Das Treffen, das zu früh endete","👀","FLAGRA: Pedro e Lara foram vistos numa pizzaria dividindo uma pizza do tamanho de uma roda de carro, rindo tanto que o garçom precisou chamar reforços. Quando os amigos chegaram, os dois fingiram que nem se conheciam.\nAlguns dizem que o folgado do Pedro só queria que ela pagasse a conta. Outros juram que é mentira da turma do fundo.|CAUGHT: Pedro and Lara were seen at a pizzeria sharing a pizza the size of a car wheel and laughing so hard the waiter had to call for backup. When their friends arrived, the two pretended they didn't even know each other.\nSome say freeloader Pedro just wanted her to pay the bill. Others swear it's a lie from the back-row crowd.|FLAGRANTE: Pedro y Lara fueron vistos en una pizzería compartiendo una pizza del tamaño de una rueda de coche y riendo tanto que el camarero tuvo que pedir refuerzos. Cuando llegaron los amigos, los dos fingieron que ni se conocían.\nAlgunos dicen que el aprovechado de Pedro solo quería que ella pagara la cuenta. Otros juran que es mentira de los del fondo.|ERWISCHT: Pedro und Lara wurden in einer Pizzeria gesehen, wie sie eine Pizza in der Größe eines Autorads teilten und so laut lachten, dass der Kellner Verstärkung rufen musste. Als die Freunde kamen, taten die beiden, als würden sie sich nicht mal kennen.\nManche sagen, der Schmarotzer Pedro wollte nur, dass sie die Rechnung zahlt. Andere schwören, das sei eine Lüge der Leute aus der letzten Reihe."],
["STORY SUSPEITO|SUSPICIOUS STORY|STORY SOSPECHOSA|VERDÄCHTIGE STORY","A indireta teve destinatário?|Was the hint meant for someone?|¿La indirecta tenía destinatario?|Hatte die Andeutung einen Adressaten?","🎯","GUERRA DECLARADA: a Duda postou “Tem gente que só lembra de você quando precisa” e, vinte minutos depois, “Ainda bem que aprendi a reconhecer gente falsa”. Três professores e a diretora viram os stories.\nDizem que era para a Jade, aquela puxa-saco. A Jade respondeu com um story de risadinha e a escola inteira já escolheu um lado.|WAR DECLARED: Duda posted “Some people only remember you when they need something” and twenty minutes later, “Glad I learned to spot fake people.” Three teachers and the principal saw the stories.\nThey say it was for Jade, that brown-noser. Jade answered with a giggling story and the whole school has already picked a side.|GUERRA DECLARADA: Duda publicó «Hay gente que solo se acuerda de ti cuando te necesita» y, veinte minutos después, «Menos mal que aprendí a reconocer a la gente falsa». Tres profesores y la directora vieron las stories.\nDicen que era para Jade, esa adulona. Jade respondió con una story de risitas y todo el colegio ya eligió bando.|KRIEGSERKLÄRUNG: Duda postete „Manche Leute erinnern sich nur an dich, wenn sie etwas brauchen“ und zwanzig Minuten später „Gut, dass ich gelernt habe, falsche Leute zu erkennen“. Drei Lehrer und die Direktorin sahen die Storys.\nAngeblich war es für Jade, diese Schleimerin. Jade antwortete mit einer kichernden Story, und die ganze Schule hat schon Partei ergriffen."],
["DUPLA IMPROVÁVEL|UNLIKELY DUO|DÚO IMPROBABLE|UNGLEICHES DUO","O trabalho escolar que aproximou demais|The school project that brought them too close|El trabajo escolar que los acercó demasiado|Das Schulprojekt, das sie zu sehr zusammenbrachte","🤝","ABSURDO: Theo e Bia foram sorteados para fazer um trabalho juntos e brigaram QUATRO VEZES só para escolher a cor da cartolina. Ele diz que ela é mandona; ela diz que ele é um preguiçoso sem noção.\nMesmo assim, fontes garantem que os dois trocam mensagens até as quatro da manhã. O professor já abriu uma aposta.|OUTRAGEOUS: Theo and Bia were paired up for a project and fought FOUR TIMES just to pick the color of the poster board. He says she's bossy; she says he's a clueless slacker.\nStill, sources swear the two text each other until four in the morning. The teacher has already started a bet.|ABSURDO: Theo y Bia fueron sorteados para hacer un trabajo juntos y pelearon CUATRO VECES solo para elegir el color de la cartulina. Él dice que ella es mandona; ella dice que él es un vago sin remedio.\nAun así, fuentes aseguran que se escriben hasta las cuatro de la madrugada. El profesor ya abrió una apuesta.|UNFASSBAR: Theo und Bia wurden für ein Projekt zusammengelost und stritten sich VIERMAL, nur um die Farbe des Plakats zu wählen. Er sagt, sie sei herrisch; sie sagt, er sei ein ahnungsloser Faulpelz.\nTrotzdem schreiben die beiden sich laut Quellen bis vier Uhr morgens. Der Lehrer hat schon eine Wette eröffnet."],
["SEGREDO REVELADO?|SECRET REVEALED?|¿SECRETO REVELADO?|GEHEIMNIS GELÜFTET?","Quase escapou!|It almost slipped out!|¡Casi se le escapa!|Fast verplappert!","🤫","Uma cliente do supermercado ouviu a Lara cochichar no corredor dos cereais: “Não conta pra ninguém, mas a gente está planejando…”. A frase foi cortada quando a Mel, a maior linguaruda do bairro, derrubou uma pirâmide de latas.\nCirculam três versões: festa surpresa, fuga para a lua ou, claro, mais uma mentira da Lara.|A supermarket customer overheard Lara whispering in the cereal aisle: “Don't tell anyone, but we're planning…” The sentence was cut off when Mel, the biggest blabbermouth in the neighborhood, knocked over a pyramid of cans.\nThree versions are going around: a surprise party, an escape to the moon or, of course, yet another lie from Lara.|Una clienta del supermercado oyó a Lara susurrar en el pasillo de cereales: «No se lo cuentes a nadie, pero estamos planeando…». La frase se cortó cuando Mel, la más chismosa del barrio, tiró una pirámide de latas.\nCirculan tres versiones: fiesta sorpresa, fuga a la luna o, claro, otra mentira de Lara.|Eine Supermarktkundin hörte Lara im Müsligang flüstern: „Sag es niemandem, aber wir planen…“ Der Satz brach ab, als Mel, die größte Klatschtante des Viertels, eine Dosenpyramide umwarf.\nEs kursieren drei Versionen: eine Überraschungsparty, eine Flucht zum Mond oder natürlich wieder eine Lüge von Lara."],
["CIÚMES DETECTADOS|JEALOUSY DETECTED|CELOS DETECTADOS|EIFERSUCHT ENTDECKT","Quem disse que não se importava?|Who said she didn't care?|¿Quién dijo que no le importaba?|Wer sagte, es sei ihr egal?","💅","CHOCANTE: a Lara jurou que não ligava para o Pedro, mas bastou ele rir com a Duda na sorveteria para o sorvete dela derreter só de raiva. Dizem que ela rasgou um guardanapo em mil pedaços e jogou fora com olhar assassino.\nSem ciúmes? Até o sorveteiro percebeu que a Lara é a pior mentirosa da cidade.|SHOCKING: Lara swore she didn't care about Pedro, but as soon as he laughed with Duda at the ice cream shop, her ice cream melted from pure rage. They say she tore a napkin into a thousand pieces and tossed it with a murderous glare.\nNo jealousy? Even the ice cream man noticed Lara is the worst liar in town.|IMPACTANTE: Lara juró que no le importaba Pedro, pero bastó verlo reír con Duda en la heladería para que su helado se derritiera de pura rabia. Dicen que rompió una servilleta en mil pedazos y la tiró con mirada asesina.\n¿Sin celos? Hasta el heladero notó que Lara es la peor mentirosa de la ciudad.|SCHOCKIEREND: Lara schwor, Pedro sei ihr egal, doch kaum lachte er mit Duda in der Eisdiele, schmolz ihr Eis vor lauter Wut. Angeblich zerriss sie eine Serviette in tausend Stücke und warf sie mit mörderischem Blick weg.\nKeine Eifersucht? Sogar der Eisverkäufer hat bemerkt, dass Lara die schlechteste Lügnerin der Stadt ist."],
["PLAYLIST SUSPEITA|SUSPICIOUS PLAYLIST|PLAYLIST SOSPECHOSA|VERDÄCHTIGE PLAYLIST","Essa música foi uma indireta?|Was that song a hint?|¿Esa canción fue una indirecta?|War dieser Song eine Andeutung?","🎧","O Caio criou uma playlist chamada “Para alguém que nunca percebe” com 847 músicas, e a turma montou uma força-tarefa para descobrir a destinatária. A suspeita número um é a Luna.\nO gosto musical dele é tão ruim que ninguém sabe se é declaração ou castigo. Se a Luna ouvir até o fim, merece um troféu de paciência.|Caio made a playlist called “For Someone Who Never Notices” with 847 songs, and the class formed a task force to find the recipient. Suspect number one is Luna.\nHis taste in music is so bad nobody knows if it's a confession or a punishment. If Luna listens to the end, she deserves a patience trophy.|Caio creó una playlist llamada «Para alguien que nunca se da cuenta» con 847 canciones, y la clase armó un equipo especial para descubrir a la destinataria. La sospechosa número uno es Luna.\nSu gusto musical es tan malo que nadie sabe si es una declaración o un castigo. Si Luna la escucha hasta el final, merece un trofeo a la paciencia.|Caio hat eine Playlist namens „Für jemanden, der es nie merkt“ mit 847 Songs erstellt, und die Klasse hat eine Sonderkommission gebildet, um die Empfängerin zu finden. Verdächtige Nummer eins ist Luna.\nSein Musikgeschmack ist so schlecht, dass keiner weiß, ob es ein Geständnis oder eine Strafe ist. Wenn Luna bis zum Ende zuhört, verdient sie eine Geduldstrophäe."],
["PLANOS SECRETOS|SECRET PLANS|PLANES SECRETOS|GEHEIME PLÄNE","Todo mundo foi convidado… menos uma pessoa?|Everyone was invited… except one person?|¿Todos fueron invitados… menos una persona?|Alle wurden eingeladen… nur eine Person nicht?","🎟️","A Jade alugou uma casa na praia para o fim de semana, convidou até o cachorro do vizinho e “esqueceu” de chamar a Duda. Dizem que foi de propósito, porque a Duda disse que a festa dela era chata.\nA Duda jura que vai aparecer de qualquer jeito, nem que seja de jangada. Prepare a pipoca.|Jade rented a beach house for the weekend, invited even the neighbor's dog and “forgot” to invite Duda. They say it was on purpose, because Duda said her party was boring.\nDuda swears she'll show up anyway, even if she has to come by raft. Grab the popcorn.|Jade alquiló una casa en la playa para el fin de semana, invitó hasta al perro del vecino y «se olvidó» de invitar a Duda. Dicen que fue a propósito, porque Duda dijo que su fiesta era aburrida.\nDuda jura que va a aparecer de todos modos, aunque sea en balsa. Prepara las palomitas.|Jade hat für das Wochenende ein Strandhaus gemietet, sogar den Hund des Nachbarn eingeladen und „vergessen“, Duda einzuladen. Angeblich war es Absicht, weil Duda ihre Party langweilig genannt hatte.\nDuda schwört, sie taucht trotzdem auf, und sei es auf einem Floß. Holt schon mal das Popcorn."],
["EX-CRUSH ALERT|EX-CRUSH ALERT|EX-CRUSH ALERT|EX-CRUSH ALERT","Superou mesmo ou só mudou de estratégia?|Really over it, or just a new strategy?|¿Lo superó o solo cambió de estrategia?|Wirklich drüber weg oder nur neue Strategie?","💔","A Mel diz que superou o ex, mas foi vista no shopping perguntando em TODAS as lojas quem é a nova paixão dele. Fontes garantem que ela stalkeou a lista de seguidores às duas da manhã e acabou com o pacote de dados do celular.\nSuperou nada, a Mel é a rainha da fingição.|Mel says she's over her ex, yet she was seen at the mall asking EVERY store who his new crush is. Sources swear she stalked his followers list at two in the morning and burned through her entire data plan.\nShe's not over anything, Mel is the queen of pretending.|Mel dice que superó a su ex, pero la vieron en el centro comercial preguntando en TODAS las tiendas quién es su nueva ilusión. Fuentes aseguran que stalkeó su lista de seguidores a las dos de la madrugada y se acabó todo el plan de datos.\nQué va a haberlo superado, Mel es la reina del fingimiento.|Mel sagt, sie sei über ihren Ex hinweg, wurde aber im Einkaufszentrum gesehen, wie sie IN JEDEM Laden fragte, wer seine neue Flamme ist. Quellen schwören, sie habe um zwei Uhr nachts seine Followerliste durchstöbert und ihr ganzes Datenvolumen verbraucht.\nÜberhaupt nicht drüber weg, Mel ist die Königin des Vortäuschens."],
["PLOT TWIST|PLOT TWIST|PLOT TWIST|PLOT TWIST","Era TUDO mentira?|Was it ALL a lie?|¿Era TODO mentira?|War ALLES gelogen?","🕵️","A aluna nova, a Aysha, contou que já morou em três países, mas a história muda a cada vez: a escola, a cidade, até o motivo da mudança.\nDizem que ela nunca saiu da cidade e inventa tudo para parecer interessante.|The new student, Aysha, said she's lived in three countries, but the story changes every time: the school, the city, even the reason she moved.\nThey say she's never left town and makes it all up to seem interesting.|La alumna nueva, Aysha, contó que vivió en tres países, pero la historia cambia cada vez: el colegio, la ciudad, hasta el motivo de la mudanza.\nDicen que nunca salió de la ciudad y lo inventa todo para parecer interesante.|Die Neue, Aysha, erzählte, sie habe in drei Ländern gelebt, aber die Geschichte ändert sich jedes Mal: Schule, Stadt, sogar der Umzugsgrund.\nAngeblich war sie nie aus der Stadt raus und erfindet alles, um interessant zu wirken."],
["ALERTA SELVAGEM|WILD ALERT|ALERTA SALVAJE|WILDER ALARM","Essa menina é Selvagem!|This girl is Wild!|¡Esta chica es salvaje!|Dieses Mädchen ist wild!","🛒","A Aysha foi vista andando de LEÃO a caminho de sua antiga escola!.\nUma maluca dessas devia vir com aviso de perigo na estrada.|Aysha was seen riding a lion on her way to her old school!.\nA crazy woman like that should come with a road hazard warning.|¡Vieron a Aysha montada en un león de camino a su antigua escuela!\nUna loca como esa debería llevar un aviso de peligro en la carretera.|Aysha wurde dabei gesehen, wie sie auf einem Löwen zu ihrer alten Schule ritt!.\nSo eine Verrückte sollte ein Warnschild am Rucksack tragen."],
["O GRANDE MISTÉRIO|THE GREAT MYSTERY|EL GRAN MISTERIO|DAS GROSSE RÄTSEL","Quem sou eu? Vocês nunca vão descobrir|Who am I? You'll never find out|¿Quién soy? Nunca lo descubrirán|Wer ich bin? Das findet ihr nie heraus","👁️","Eu vejo tudo. Sei quem colou na prova, quem apagou a mensagem e quem fingiu que estava tudo bem. E sim, eu leio os comentários me chamando de mentirosa, só podem ser os invejosos de sempre.\nVocês me procuram por aí, mas eu estou sentada na mesma sala que vocês. Vocês ainda não sabem de tudo.|I see everything. I know who cheated on the test, who deleted the message and who pretended everything was fine. And yes, I read the comments calling me a liar, it must be the usual jealous crowd.\nYou're looking for me out there, but I'm sitting in the same room as you. You still don't know everything.|Yo lo veo todo. Sé quién copió en el examen, quién borró el mensaje y quién fingió que todo estaba bien. Y sí, leo los comentarios que me llaman mentirosa, deben de ser los envidiosos de siempre.\nMe buscan por ahí, pero estoy sentada en la misma sala que ustedes. Todavía no lo saben todo.|Ich sehe alles. Ich weiß, wer in der Klausur abgeschrieben, wer die Nachricht gelöscht und wer so getan hat, als wäre alles gut. Und ja, ich lese die Kommentare, die mich Lügnerin nennen, das sind bestimmt die üblichen Neider.\nIhr sucht mich da draußen, aber ich sitze im selben Raum wie ihr. Ihr wisst noch lange nicht alles."]
];
const $=s=>document.querySelector(s),LI=["pt","en","es","de"];
let lang="pt",lvl=matchMedia("(prefers-reduced-motion:reduce)").matches?1:4,io;

function render(){
  const t=I[lang],k=LI.indexOf(lang);
  document.documentElement.lang={pt:"pt-BR",en:"en",es:"es",de:"de"}[lang];
  $("#slogan").textContent=t.slogan;$("#last").textContent=t.last;
  $("#llang").textContent=t.lang+":";$("#lanim").textContent=t.anim+":";
  $("#quote").textContent=t.q;$("#sig").textContent=t.sig;$("#foot").textContent=t.foot;
  $("#lv").innerHTML=t.lv.map((n,i)=>`<option value="${i+1}"${i+1===lvl?" selected":""}>${n}</option>`).join("");
  document.querySelectorAll(".lg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const heads=S.map(s=>s[1].split("|")[k]+" "+s[2]);
  $("#rail").textContent=heads.join("   💋   ");
  $("#grid").innerHTML=S.map((s,i)=>{
    const p=s[3].split("|")[k].split("\n");
    return `<article class="card pre"><div class="n">${String(i+1).padStart(2,"0")}</div><button class="hd" aria-expanded="false" aria-controls="b${i}"><span class="tag">${s[0].split("|")[k]}</span><span class="h2">${s[1].split("|")[k]} ${s[2]}</span><span class="chev" aria-hidden="true">▾</span></button><div class="bd" id="b${i}"><div class="bd-in"><p>${p[0]}</p><p class="q">${p[1]}</p></div></div></article>`;
  }).join("");
  observe();
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
}
/* brilho no logo */
const logo=document.querySelector(".logo");
for(let i=0;i<14;i++){const s=document.createElement("span");s.className="sp";s.textContent="✦";
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${10+Math.random()*16}px;animation-delay:${(Math.random()*2).toFixed(2)}s`;logo.appendChild(s)}
const setSp=()=>document.querySelectorAll(".sp").forEach((s,i)=>s.style.display=lvl>1&&i<[0,4,8,12,14][lvl-1]?"":"none");
/* glitter em tela cheia */
const cv=$("#fx"),cx=cv.getContext("2d"),CNT=[0,10,25,55,110],SPD=[0,.35,.6,1,1.8],COL=["#fff","#ffd86b","#ff2d95","#b36bff","#7fd8ff"];
let W,H,P=[],T=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
const mk=()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+1,vx:(Math.random()-.5)*.4,vy:-(Math.random()*.5+.15),p:Math.random()*6.28,c:COL[Math.random()*5|0]});
function star(x,y,r){cx.beginPath();cx.moveTo(x,y-r*2);cx.quadraticCurveTo(x,y,x+r*2,y);cx.quadraticCurveTo(x,y,x,y+r*2);cx.quadraticCurveTo(x,y,x-r*2,y);cx.quadraticCurveTo(x,y,x,y-r*2);cx.fill()}
function loop(){
  cx.clearRect(0,0,W,H);const s=SPD[lvl-1];
  for(const q of P){q.x+=q.vx*s;q.y+=q.vy*s;q.p+=.05*s;if(q.y<-10){q.y=H+10;q.x=Math.random()*W}
    cx.globalAlpha=.35+.65*Math.abs(Math.sin(q.p));cx.fillStyle=q.c;star(q.x,q.y,q.r)}
  T=T.filter(q=>q.l>0);
  for(const q of T){q.x+=q.vx;q.y+=q.vy;q.vy+=.04;q.l--;cx.globalAlpha=q.l/40;cx.fillStyle=q.c;star(q.x,q.y,q.r)}
  requestAnimationFrame(loop);
}
addEventListener("resize",size);
addEventListener("pointermove",e=>{
  if(lvl>=4)for(let i=0;i<(lvl===5?3:1);i++)T.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*2,vy:Math.random()*-1.5,r:Math.random()*2+1,l:40,c:COL[Math.random()*5|0]});
  if(lvl===5){const c=e.target.closest&&e.target.closest(".card");
    if(c){const b=c.getBoundingClientRect();c.style.setProperty("--ry",((e.clientX-b.left)/b.width-.5)*10+"deg");c.style.setProperty("--rx",(.5-(e.clientY-b.top)/b.height)*10+"deg")}}
});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
function setLvl(n){lvl=n;document.documentElement.dataset.lvl=n;P=Array.from({length:CNT[n-1]},mk);setSp()}
document.querySelectorAll(".lg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
$("#lv").onchange=e=>setLvl(+e.target.value);
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".hd");if(!b)return;const c=b.parentElement,o=c.classList.toggle("open");b.setAttribute("aria-expanded",o)});
size();render();setLvl(lvl);loop();
</script>
</body>
</html>
